<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#11161f">
<title>runeBOOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --ink: #11161f; --stone: rgba(26, 33, 45, 0.9); --stone-voll: #1a212d; --stone-2: #232c3a; --line: #313b4c;
    --parch: #ebe3d2; --muted: #a49b8b; --ember: #e3a54e; --frost: #84d8e8; --rune: #b39cff; --rot: #e5735f; --gruen: #9fd99a;
    --display: "Cinzel", Georgia, serif; --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--parch); overflow: hidden; overscroll-behavior: none; font-family: var(--body); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #leinwand { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Anzeige im Spiel ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .tafel { background: var(--stone); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .oben-links { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: grid; gap: 6px; padding: 8px 12px; }
  .marke { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .03em; }
  .marke b { color: var(--ember); }
  .res { display: flex; gap: 14px; font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  .res span, .bst span { display: inline-flex; align-items: center; gap: 6px; }
  .res i, .bst i { width: 10px; height: 10px; display: inline-block; transform: rotate(45deg); border-radius: 2px; }
  i.holz { background: #a0703a; } i.nahrung { background: #c9a04a; } i.stein { background: #a8a29a; } i.kristall { background: #7fe9ff; box-shadow: 0 0 6px #7fe9ff; }
  i.feuerstein { background: #ff8a3c; } i.windrune { background: #b39cff; } i.eisenerz { background: #6d7076; } i.drachenschuppe { background: #c0392b; }
  .bst { display: flex; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .bst span.null { opacity: .45; }

  .uhr { position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); min-width: 300px; padding: 8px 16px 10px; text-align: center; display: grid; gap: 4px; }
  .uhr .titel { font-family: var(--display); font-size: 20px; font-weight: 700; }
  .uhr .unter { font-size: 14px; color: var(--muted); }
  .uhr .balken { height: 5px; background: #2a3242; border-radius: 3px; overflow: hidden; }
  .uhr .balken > div { height: 100%; background: linear-gradient(90deg, var(--ember), #ffd28a); width: 0%; }
  .uhr.nacht .titel { color: var(--frost); } .uhr.nacht .balken > div { background: linear-gradient(90deg, #5b78c9, var(--frost)); }
  .uhr button { justify-self: center; margin-top: 2px; background: var(--stone-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
  .uhr button:hover { border-color: var(--frost); }

  .oben-rechts { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: grid; gap: 6px; justify-items: end; }
  .karte { padding: 4px; display: grid; gap: 2px; cursor: pointer; }
  .karte canvas { width: 196px; height: 196px; image-rendering: pixelated; display: block; border-radius: 4px; }
  .karte span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-align: center; }
  .knoepfe { display: flex; gap: 4px; padding: 4px; }
  .knoepfe button { min-width: 36px; height: 32px; background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .knoepfe button[aria-pressed="true"] { background: var(--ember); color: #1a1208; border-color: var(--ember); }

  .unten { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 24px); overflow-x: auto; }
  .bau { width: 92px; flex: none; background: var(--stone-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 6px 5px; display: grid; gap: 2px; text-align: left; position: relative; }
  .bau:hover { border-color: var(--muted); }
  .bau[aria-pressed="true"] { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember); }
  .bau.gesperrt { opacity: .45; }
  .bau.teuer .preis { color: var(--rot); }
  .bau b { font-size: 13px; line-height: 1.1; }
  .bau .preis { font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.3; }
  .bau kbd { position: absolute; right: 5px; top: 4px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .bau.sonder { background: #2b2440; }
  .trenner { width: 1px; background: var(--line); margin: 4px 2px; flex: none; }

  .tipp { position: absolute; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px); transform: translateX(-50%); padding: 8px 14px; max-width: min(520px, calc(100vw - 24px)); font-size: 14px; text-align: center; pointer-events: none; }
  .tipp b { color: var(--ember); }
  .tipp .grund { color: var(--rot); }

  #meldungen { position: absolute; left: 50%; top: 118px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(560px, calc(100vw - 24px)); }
  .meldung { padding: 7px 14px; font-size: 15px; border-left: 3px solid var(--muted); animation: rein .25s ease-out; transition: opacity .6s; }
  .meldung.gut { border-left-color: var(--gruen); } .meldung.schlecht { border-left-color: var(--rot); } .meldung.info { border-left-color: var(--frost); }
  .meldung.aus { opacity: 0; }
  @keyframes rein { from { opacity: 0; transform: translateY(-6px); } }

  .panel { position: absolute; right: max(12px, env(safe-area-inset-right)); top: 290px; width: 300px; max-height: calc(100vh - 400px); overflow-y: auto; padding: 14px 16px; display: grid; gap: 10px; }
  .panel h2 { font-family: var(--display); font-size: 18px; margin: 0; color: var(--ember); }
  .panel p { margin: 0; font-size: 14px; color: #d9d1c0; }
  .panel .zeile { display: flex; justify-content: space-between; font-size: 14px; }
  .panel .zeile span:first-child { color: var(--muted); }
  .panel .hp { height: 6px; background: #2a3242; border-radius: 3px; overflow: hidden; }
  .panel .hp > div { height: 100%; background: var(--gruen); }
  .panel button.aktion { background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 14px; }
  .panel button.aktion:hover:not(:disabled) { border-color: var(--ember); }
  .panel button.aktion:disabled { opacity: .45; cursor: default; }
  .panel .schliessen { position: absolute; right: 8px; top: 6px; background: none; border: 0; font-size: 18px; color: var(--muted); }
  .rezept { border: 1px solid var(--line); border-radius: 5px; padding: 10px; display: grid; gap: 6px; }
  .rezept.fertig { border-color: #3f5c42; background: rgba(60, 90, 64, .18); }
  .rezept h3 { margin: 0; font-size: 15px; font-family: var(--display); }
  .rezept .zutaten { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .rezept .zutaten span { display: inline-flex; align-items: center; gap: 5px; }
  .rezept .zutaten span.fehlt { color: var(--rot); }
  .rezept.schluessel { border-color: #6b5530; }
  .rezept.geheim { border-style: dashed; opacity: .8; }
  .rezept .zeitalter { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ember); }
  .panel .grund { color: var(--rot); font-size: 13px; }
  .panel h3.buch { margin: 6px 0 0; font-family: var(--display); font-size: 16px; color: var(--ember); }
  .zweige { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .zweige button.aktion { text-align: left; line-height: 1.25; }
  .zweige small { color: var(--muted); font-size: 12px; }
  .zeitalter-anz { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ember); }
  .uhr .faehig { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .uhr .faehig button { border-color: var(--ember); }
  .rezept .zutaten i { width: 8px; height: 8px; display: inline-block; transform: rotate(45deg); border-radius: 2px; }

  .einfuehrung { position: absolute; left: max(12px, env(safe-area-inset-left)); top: 168px; width: 280px; padding: 12px 14px; display: grid; gap: 8px; border-left: 3px solid var(--rune); }
  .einfuehrung .schritt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--rune); }
  .einfuehrung p { margin: 0; font-size: 14px; line-height: 1.45; } .einfuehrung b { color: var(--ember); }
  .einfuehrung button { justify-self: start; background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
  .uhr button:disabled { opacity: .45; cursor: default; }
  .panel .regler { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .panel .regler input { width: 100%; accent-color: var(--ember); }
  .panel .wahl { display: flex; gap: 4px; }
  .panel .wahl button { background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font-size: 13px; }
  .panel .wahl button[aria-pressed="true"] { background: var(--ember); color: #1a1208; border-color: var(--ember); }
  @media (max-width: 760px) { .einfuehrung { top: auto; bottom: 230px; width: auto; right: 12px; } }

  /* ---------- Start und Ende ---------- */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(17,22,31,.55), rgba(8,10,16,.92)); padding: 20px; overflow-y: auto; }
  .karte-gross { width: min(640px, 100%); padding: 28px 30px; display: grid; gap: 16px; }
  .karte-gross h1 { font-family: var(--display); font-size: clamp(40px, 8vw, 64px); margin: 0; line-height: 1; letter-spacing: .02em; }
  .karte-gross h1 b { color: var(--ember); }
  .karte-gross .unter { font-family: var(--display); color: var(--rune); letter-spacing: .08em; font-size: 18px; margin-top: -6px; }
  .karte-gross p { margin: 0; color: #d9d1c0; font-size: 16px; line-height: 1.5; }
  .feld { display: flex; gap: 8px; flex-wrap: wrap; }
  .feld label { width: 100%; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .feld input { flex: 1; min-width: 180px; background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; color: var(--frost); font-family: var(--mono); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  .feld button, .knopf { background: var(--stone-2); border: 1px solid var(--line); border-radius: 5px; padding: 10px 14px; font-size: 16px; }
  .knopf.haupt { background: var(--ember); color: #1a1208; border-color: var(--ember); font-weight: 700; }
  .reihe { display: flex; gap: 10px; flex-wrap: wrap; }
  .hilfe { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; color: var(--muted); }
  .hilfe kbd { font-family: var(--mono); font-size: 12px; color: var(--parch); }
  .laden { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--muted); pointer-events: none; }
  @media (max-width: 760px) {
    .karte canvas { width: 120px; height: 120px; }
    .uhr { min-width: 0; top: auto; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 84px); }
    .panel { top: auto; bottom: 150px; right: 12px; left: 12px; width: auto; max-height: 40vh; }
    #meldungen { top: 90px; }
    .oben-links { padding: 6px 8px; } .res { gap: 10px; font-size: 13px; } .bst { display: none; }
  }

  /* ---------- Hauptmenü über der lebenden Welt ---------- */
  .menue { position: fixed; inset: 0; display: flex; align-items: stretch; gap: 28px; padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 28px max(36px, env(safe-area-inset-left));
    background: linear-gradient(90deg, rgba(8,10,16,.86) 0%, rgba(8,10,16,.62) 30%, rgba(8,10,16,.08) 62%, rgba(8,10,16,0) 100%), linear-gradient(0deg, rgba(8,10,16,.55), rgba(8,10,16,0) 35%); overflow-y: auto; }
  .menue-spalte { width: min(400px, 100%); display: flex; flex-direction: column; gap: 26px; justify-content: center; }
  .titel { font-family: var(--display); font-size: clamp(52px, 8vw, 92px); line-height: .92; margin: 0; letter-spacing: .01em; color: #f3ead6; text-shadow: 0 4px 0 #2a1c10, 0 0 36px rgba(227,165,78,.25); }
  .titel b { color: var(--ember); text-shadow: 0 4px 0 #3a2410, 0 0 30px rgba(255,170,70,.45); }
  .untertitel { font-family: var(--display); color: #d9c9ff; letter-spacing: .18em; text-transform: uppercase; font-size: clamp(13px, 1.6vw, 17px); margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  .untertitel::before, .untertitel::after { content: ""; height: 1px; flex: 0 0 34px; background: linear-gradient(90deg, transparent, var(--rune)); }
  .untertitel::after { transform: scaleX(-1); }
  .menue-liste { display: grid; gap: 10px; }
  .menue-knopf { display: grid; gap: 1px; text-align: left; padding: 12px 18px 12px 20px; border-radius: 6px; border: 1px solid rgba(227,165,78,.22);
    background: linear-gradient(180deg, rgba(42,50,66,.82), rgba(24,30,42,.86)); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.35); position: relative; transition: transform .15s, border-color .15s, background .15s; }
  .menue-knopf::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ember); opacity: 0; transition: opacity .15s; }
  .menue-knopf span { font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  .menue-knopf small { color: var(--muted); font-size: 14px; }
  .menue-knopf:hover, .menue-knopf[aria-pressed="true"] { transform: translateX(4px); border-color: var(--ember); background: linear-gradient(180deg, rgba(58,64,80,.9), rgba(30,36,50,.9)); }
  .menue-knopf:hover::before, .menue-knopf[aria-pressed="true"]::before { opacity: 1; }
  .menue-knopf.haupt { border-color: var(--ember); background: linear-gradient(180deg, #e8b35e, #c98a35); color: #1a1208; }
  .menue-knopf.haupt small { color: #3d2a12; }
  .menue-fuss { color: var(--muted); font-size: 13px; font-family: var(--mono); letter-spacing: .04em; }
  .menue-seite { align-self: center; width: min(520px, 100%); max-height: calc(100vh - 80px); overflow-y: auto; padding: 22px 24px; display: grid; gap: 14px; background: rgba(20,25,35,.9); backdrop-filter: blur(6px); }
  .menue-seite h2 { font-family: var(--display); margin: 0; font-size: 24px; color: var(--ember); }
  .menue-seite p { margin: 0; color: #d9d1c0; line-height: 1.5; }
  .stufen-wahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stufen-wahl button { text-align: left; padding: 10px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--stone-2); display: grid; gap: 2px; }
  .stufen-wahl button b { font-family: var(--display); font-size: 16px; }
  .stufen-wahl button small { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .stufen-wahl button[aria-pressed="true"] { border-color: var(--ember); background: rgba(227,165,78,.14); }
  .platz { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--stone-2); }
  .platz b { font-family: var(--display); } .platz small { color: var(--muted); grid-column: 1; }
  .platz .knoepfe2 { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
  .platz button { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 14px; }
  .platz button.haupt { background: var(--ember); color: #1a1208; border-color: var(--ember); }
  .platz button:disabled { opacity: .4; cursor: default; }
  .menue-seite .regler { display: grid; gap: 4px; color: var(--muted); }
  .menue-seite .regler input { accent-color: var(--ember); }
  .menue-seite .wahl { display: flex; gap: 6px; }
  .menue-seite .wahl button { background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; }
  .menue-seite .wahl button[aria-pressed="true"] { background: var(--ember); color: #1a1208; border-color: var(--ember); }
  @media (max-width: 860px) {
    .menue { flex-direction: column; justify-content: flex-start; padding: 24px 16px; gap: 18px; background: linear-gradient(180deg, rgba(8,10,16,.82), rgba(8,10,16,.45) 60%, rgba(8,10,16,.7)); }
    .menue-spalte { width: 100%; justify-content: flex-start; }
    .menue-seite { width: auto; max-height: none; }
    .stufen-wahl { grid-template-columns: 1fr; }
  }

  /* ---------- Erfindungsbaum ---------- */
  .baum { position: fixed; inset: 0; background: rgba(8,10,16,.88); backdrop-filter: blur(4px); display: grid; grid-template-rows: auto 1fr; padding: max(14px, env(safe-area-inset-top)) 18px 14px; gap: 12px; z-index: 5; }
  .baum-kopf { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .baum-kopf h2 { font-family: var(--display); margin: 0; color: var(--ember); font-size: 24px; }
  .baum-za { color: var(--muted); font-size: 14px; }
  .baum-bst { display: flex; gap: 12px; font-family: var(--mono); font-size: 13px; flex-wrap: wrap; }
  .baum-bst span { display: inline-flex; align-items: center; gap: 5px; }
  .baum-bst i, .ekarte i { width: 8px; height: 8px; display: inline-block; transform: rotate(45deg); border-radius: 2px; }
  .baum-reiter { display: flex; gap: 6px; margin-left: auto; }
  .baum-reiter button { background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; }
  .baum-reiter button[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
  .baum .schliessen { background: none; border: 0; font-size: 26px; color: var(--muted); }
  .baum-inhalt { overflow: auto; }
  .baum-gitter { display: grid; grid-template-columns: 120px repeat(4, minmax(170px, 1fr)); gap: 6px; min-width: 820px; }
  .baum-gitter .zkopf { font-family: var(--display); font-size: 15px; padding: 8px 10px; border-radius: 5px; background: var(--stone-2); border: 1px solid var(--line); }
  .baum-gitter .zkopf.jetzt { border-color: var(--ember); color: var(--ember); }
  .baum-gitter .zkopf.zu { opacity: .55; }
  .baum-gitter .zkopf small { display: block; font-family: var(--body); color: var(--muted); font-size: 12px; }
  .baum-gitter .wkopf { font-family: var(--display); font-size: 14px; color: var(--rune); padding: 8px 4px; align-self: start; }
  .baum-gitter .zelle { display: grid; gap: 6px; align-content: start; padding: 4px; border-radius: 5px; background: rgba(255,255,255,.02); }
  .ekarte { text-align: left; display: grid; gap: 3px; padding: 7px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--stone-2); font-size: 13px; }
  .ekarte b { font-size: 14px; }
  .ekarte .zut { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ekarte .zut .fehlt { color: var(--rot); }
  .ekarte.fertig { border-color: #3f5c42; background: rgba(60,90,64,.28); }
  .ekarte.kann { border-color: var(--ember); box-shadow: 0 0 0 1px rgba(227,165,78,.35); }
  .ekarte.zu { opacity: .5; }
  .ekarte.geheim { border-style: dashed; color: var(--muted); }
  .ekarte.schluessel b { color: var(--ember); }
  .ekarte[aria-pressed="true"] { outline: 2px solid var(--frost); }
  .baum-detail { position: fixed; right: 18px; bottom: 18px; width: min(380px, calc(100% - 36px)); padding: 14px 16px; display: grid; gap: 8px; z-index: 6; }
  .baum-detail h3 { margin: 0; font-family: var(--display); color: var(--ember); }
  .baum-detail p { margin: 0; color: #d9d1c0; font-size: 14px; line-height: 1.45; }
  .baum-detail .grund { color: var(--rot); font-size: 13px; }
  .baum-detail button.aktion { background: var(--ember); color: #1a1208; border: 0; border-radius: 4px; padding: 8px 12px; font-weight: 700; }
  .baum-detail button.aktion:disabled { opacity: .45; }
  .baum-liste { display: grid; gap: 6px; max-width: 640px; }
  .baum-liste .zeile { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; background: var(--stone-2); border: 1px solid var(--line); border-radius: 5px; font-size: 14px; }

  /* ---------- Bericht der Nacht ---------- */
  .bericht { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: min(420px, calc(100% - 24px)); padding: 14px 18px; display: grid; gap: 8px; z-index: 3; pointer-events: auto; }
  .bericht h2 { margin: 0; font-family: var(--display); color: var(--ember); font-size: 20px; }
  .bericht .zeile { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .bericht .zeile span:first-child { color: var(--muted); }
  .bericht ol { margin: 0; padding-left: 20px; font-size: 14px; }
  .bericht button { justify-self: end; background: var(--stone-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; }
  .bewohner { display: flex; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .bewohner b { color: var(--parch); font-weight: 500; }
  .bewohner .warn { color: var(--rot); }
</style>
</head>
