# Apps bauen und als Release veröffentlichen: Mac, Windows, Linux (Tauri), Android und iPhone/iPad (Capacitor).
# Läuft bei jedem Push auf main und von Hand. Das Release heißt nach der Version in package.json.
name: Desktop-Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-apps
  cancel-in-progress: true

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            name: windows
            args: ''
          - os: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux-Pakete
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:web
      - name: App bauen
        run: npx --yes @tauri-apps/cli@2.9.4 build ${{ matrix.args }}
      - name: Dateien mit festen Namen sammeln
        shell: bash
        run: |
          mkdir -p ausgabe
          if [ "${{ matrix.name }}" = "mac" ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ausgabe/runeBOOM-mac.dmg
          elif [ "${{ matrix.name }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe ausgabe/runeBOOM-windows-setup.exe
            cp src-tauri/target/release/bundle/msi/*.msi ausgabe/runeBOOM-windows.msi
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage ausgabe/runeBOOM-linux.AppImage
            cp src-tauri/target/release/bundle/deb/*.deb ausgabe/runeBOOM-linux.deb
          fi
          ls -la ausgabe
      - uses: actions/upload-artifact@v4
        with:
          name: runeboom-${{ matrix.name }}
          path: ausgabe/*

  android:
    # Android-App (APK, mit Testschlüssel signiert: direkt installierbar, für Google Play später mit eigenem Schlüssel)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web
      - run: bash tools/handy_vorbereiten.sh android
      - name: APK bauen
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p ausgabe && cp android/app/build/outputs/apk/debug/app-debug.apk ausgabe/runeBOOM-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: runeboom-android
          path: ausgabe/*

  ios:
    # iPhone/iPad: ohne Apple-Entwicklerkonto nur für den Simulator (zum Prüfen); fürs Gerät braucht es ein Zertifikat
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: bash tools/handy_vorbereiten.sh ios
      - name: Für den Simulator bauen
        run: |
          if [ -d ios/App/App.xcworkspace ]; then quelle="-workspace ios/App/App.xcworkspace"; else quelle="-project ios/App/App.xcodeproj"; fi
          xcodebuild $quelle -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ausgabe
          (cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/ausgabe/runeBOOM-ios-simulator.zip" App.app)
      - uses: actions/upload-artifact@v4
        with:
          name: runeboom-ios
          path: ausgabe/*

  veroeffentlichen:
    needs: [bauen, android, ios]
    if: ${{ !cancelled() && needs.bauen.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ausgabe
          merge-multiple: true
      - name: Version lesen
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: runeBOOM ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ausgabe/*
