# Desktop-Apps (Mac, Windows, Linux) mit Tauri bauen und als Release veröffentlichen.
# Läuft bei jedem Push auf main und von Hand. Das Release heißt nach der Version in package.json.
name: Desktop-Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-apps
  cancel-in-progress: true

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            name: windows
            args: ''
          - os: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux-Pakete
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:web
      - name: App bauen
        run: npx --yes @tauri-apps/cli@2.9.4 build ${{ matrix.args }}
      - name: Dateien mit festen Namen sammeln
        shell: bash
        run: |
          mkdir -p ausgabe
          if [ "${{ matrix.name }}" = "mac" ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ausgabe/runeBOOM-mac.dmg
          elif [ "${{ matrix.name }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe ausgabe/runeBOOM-windows-setup.exe
            cp src-tauri/target/release/bundle/msi/*.msi ausgabe/runeBOOM-windows.msi
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage ausgabe/runeBOOM-linux.AppImage
            cp src-tauri/target/release/bundle/deb/*.deb ausgabe/runeBOOM-linux.deb
          fi
          ls -la ausgabe
      - uses: actions/upload-artifact@v4
        with:
          name: runeboom-${{ matrix.name }}
          path: ausgabe/*

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ausgabe
          merge-multiple: true
      - name: Version lesen
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: runeBOOM ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ausgabe/*
